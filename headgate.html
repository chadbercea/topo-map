<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Headgate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #04080a;
    --line: #3fd0c0;
    --major: #a8fff2;
    --tan: #e2b97f;
    --text: #bdf5ee;
    --muted: #4f8f88;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; color: var(--text);
    font: 12px/1.45 "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; letter-spacing: .04em;
    -webkit-user-select: none; user-select: none; }
  #map { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; opacity: 0; transition: opacity .6s;
    touch-action: none; cursor: crosshair; }
  #map.ready { opacity: 1; }
  #minor path { fill: none; stroke: var(--line); stroke-width: .8; vector-effect: non-scaling-stroke; }
  #major path { fill: none; stroke: var(--major); stroke-width: 1.4; vector-effect: non-scaling-stroke; }
  #tan { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; }
  #river { fill: none; stroke: var(--major); stroke-opacity: .5; stroke-width: 1; stroke-dasharray: 2 5;
    vector-effect: non-scaling-stroke; }

  .overlay { position: fixed; inset: 0; pointer-events: none; }
  #grid { background-image:
      linear-gradient(rgba(63,208,192,.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(63,208,192,.06) 1px, transparent 1px);
    background-size: 80px 80px; background-position: center; }
  #vignette { background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,.7) 100%); }

  .hud { position: fixed; pointer-events: none; }
  #head { top: 16px; left: 16px; }
  .label { color: var(--muted); font-size: 9px; letter-spacing: .18em; }
  .title { font-size: 26px; font-weight: 600; letter-spacing: .08em; line-height: 1.05; margin: 4px 0 2px; color: var(--major); }
  #head a { color: var(--muted); pointer-events: auto; }
  #head a:hover { color: var(--major); }
  #status { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); white-space: nowrap;
    color: #ffe2b8; font-size: 12px; letter-spacing: .24em; transition: opacity 1.2s; }
  #status.gone { opacity: 0; }
  .retry { font: inherit; font-size: 10px; color: var(--text); background: none; border: 1px solid var(--tan);
    padding: 4px 10px; margin-left: 10px; cursor: pointer; letter-spacing: .1em; pointer-events: auto; }
  @media (max-width: 760px) { .title { font-size: 18px; } }
</style>
</head>
<body>
<svg id="map" preserveAspectRatio="xMidYMid slice" aria-label="Topographic contour map of Twin Falls, Idaho. Touch the map and the contour lines light up tan.">
  <defs>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g id="minor"></g>
  <g id="major" filter="url(#glow)"></g>
  <path id="river"></path>
</svg>
<!-- The tan lines: drawn once, and shown only where the map has been touched. -->
<canvas id="tan"></canvas>
<div id="grid" class="overlay"></div>
<div id="vignette" class="overlay"></div>
<div id="head" class="hud">
  <div class="label">TOPO SURVEY // SNAKE RIVER</div>
  <div class="title">HEADGATE</div>
  <div class="label">TWIN FALLS · IDAHO · <a href="./">MAP</a></div>
</div>
<div id="status" class="hud">LOADING ELEVATION DATA…</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
// Headgate (ILI-1086): the survey map's dark look, and the contour lines light up tan where you touch.
// A touch blooms out from the finger, then settles to a faint tan afterglow that stays.
// The terrain loading and river tracing follow index.html.
const TILE_URL = "https://s3.amazonaws.com/elevation-tiles-prod/terrarium";
const LOC = { lat: 42.5940, lon: -114.4060, step: 5 };
const CALM = matchMedia("(prefers-reduced-motion: reduce)").matches;
const R = 70;           // px: how far a touch lights the lines
const BLOOM = 450;      // ms for a touch to open up
const SETTLE = 2600;    // ms for it to settle to its afterglow
const REST = .35;       // afterglow strength
const GAP = 18;         // px a drag moves between touches

const $ = id => document.getElementById(id);
const svg = $("map");
const tan = $("tan"), tctx = tan.getContext("2d");
let state = null, lines = null, spots = [], raf = 0, press = null, touched = false;
let tanLines = null, settled = null;   // offscreen canvases: the tan lines, and the afterglow of settled touches

const lon2tile = (lon, z) => (lon + 180) / 360 * 2 ** z;
const lat2tile = (lat, z) => { const r = lat * Math.PI / 180; return (1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * 2 ** z; };
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const ease = t => 1 - (1 - t) ** 3;

function loadImg(url) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = url;
  });
}

// Same tile window as the map: zoom 13 on landscape screens, 12 on portrait.
function tileWindow() {
  const z = innerWidth >= innerHeight ? 13 : 12;
  const rows = 3, cols = Math.max(3, Math.min(7, Math.ceil(rows * innerWidth / innerHeight)));
  const W = cols * 256, H = rows * 256;
  const ox = Math.round(lon2tile(LOC.lon, z) * 256 - W / 2);
  const oy = Math.round(lat2tile(LOC.lat, z) * 256 - H / 2);
  const ds = Math.max(1, Math.ceil(Math.sqrt(W * H / 320000)));
  return { z, cols, W, H, ox, oy, ds, gw: Math.floor(W / ds), gh: Math.floor(H / ds) };
}

async function fetchElevation() {
  const { z, cols, W, H, ox, oy, ds, gw, gh } = tileWindow();
  const canvas = document.createElement("canvas");
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext("2d", { willReadFrequently: true });
  const jobs = [];
  for (let ty = Math.floor(oy / 256); ty * 256 < oy + H; ty++) for (let tx = Math.floor(ox / 256); tx * 256 < ox + W; tx++) {
    jobs.push(loadImg(`${TILE_URL}/${z}/${tx}/${ty}.png`).then(img => ctx.drawImage(img, tx * 256 - ox, ty * 256 - oy)));
  }
  await Promise.all(jobs);
  const px = ctx.getImageData(0, 0, W, H).data;
  const values = new Float64Array(gw * gh);
  for (let y = 0; y < gh; y++) for (let x = 0; x < gw; x++) {
    const i = ((y * ds) * W + x * ds) * 4;
    values[y * gw + x] = px[i] * 256 + px[i + 1] + px[i + 2] / 256 - 32768;
  }
  return { values, z, cols, W, H, gw, gh, ds, ox, oy };
}

function render(d) {
  const { gw, gh } = d;
  d3.blur2({ data: d.values, width: gw, height: gh }, 1);
  let min = Infinity, max = -Infinity;
  for (const v of d.values) { if (v < min) min = v; if (v > max) max = v; }
  const step = LOC.step;
  const contours = d3.contours().size([gw, gh]).thresholds(d3.range(Math.ceil(min / step) * step, max, step))(d.values);
  const isMajor = v => Math.abs(v / (step * 5) - Math.round(v / (step * 5))) < 1e-6;
  const opacity = v => 0.25 + 0.75 * (v - min) / (max - min || 1);
  const path = d3.geoPath();
  const minor = contours.filter(c => !isMajor(c.value)), major = contours.filter(c => isMajor(c.value));
  d3.select("#minor").selectAll("path").data(minor).join("path").attr("d", path).attr("stroke-opacity", c => opacity(c.value) * 0.7);
  d3.select("#major").selectAll("path").data(major).join("path").attr("d", path).attr("stroke-opacity", c => opacity(c.value));
  svg.setAttribute("viewBox", `0 0 ${gw} ${gh}`);

  state = { ...d, min, max };
  lines = { minor: minor.map(c => new Path2D(path(c))), major: major.map(c => new Path2D(path(c))) };
  spots = [];
  traceRiver();
  svg.classList.add("ready");
  layout();
  $("status").textContent = "TOUCH THE MAP";
}

// ---------- River: least-cost path through the elevation grid, east edge to west edge (as in index.html) ----------
function traceRiver() {
  const { values, gw, gh, min } = state, N = gw * gh;
  const cost = new Float64Array(N);
  for (let i = 0; i < N; i++) cost[i] = (values[i] - min + 1) ** 2.5;
  const dist = new Float64Array(N).fill(Infinity), prev = new Int32Array(N).fill(-1);
  const hk = [], hv = [];
  const push = (k, v) => {
    let i = hk.length; hk.push(k); hv.push(v);
    while (i > 0) { const p = (i - 1) >> 1; if (hk[p] <= k) break; hk[i] = hk[p]; hv[i] = hv[p]; i = p; }
    hk[i] = k; hv[i] = v;
  };
  const pop = () => {
    const v = hv[0], k = hk.pop(), last = hv.pop(), n = hk.length;
    if (n) {
      let i = 0;
      for (;;) {
        let c = 2 * i + 1; if (c >= n) break;
        if (c + 1 < n && hk[c + 1] < hk[c]) c++;
        if (hk[c] >= k) break;
        hk[i] = hk[c]; hv[i] = hv[c]; i = c;
      }
      hk[i] = k; hv[i] = last;
    }
    return v;
  };
  const edge = gw >> 2;
  const isSource = (x, y) => x === gw - 1 || ((y === 0 || y === gh - 1) && x >= gw - edge);
  const isTarget = (x, y) => x === 0 || ((y === 0 || y === gh - 1) && x < edge);
  for (let y = 0; y < gh; y++) for (let x = 0; x < gw; x++) if (isSource(x, y)) {
    const i = y * gw + x; dist[i] = cost[i]; push(cost[i], i);
  }
  let end = -1;
  while (hk.length) {
    const d0 = hk[0], i = pop();
    if (d0 > dist[i]) continue;
    const x = i % gw, y = (i / gw) | 0;
    if (isTarget(x, y)) { end = i; break; }
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      if (!dx && !dy) continue;
      const nx = x + dx, ny = y + dy;
      if (nx < 0 || ny < 0 || nx >= gw || ny >= gh) continue;
      const j = ny * gw + nx, nd = d0 + cost[j] * (dx && dy ? Math.SQRT2 : 1);
      if (nd < dist[j]) { dist[j] = nd; prev[j] = i; push(nd, j); }
    }
  }
  if (end < 0) return;
  const raw = [];
  for (let i = end; i >= 0; i = prev[i]) raw.push([i % gw, (i / gw) | 0]);
  const W = 6, pts = [];
  for (let i = 0; i < raw.length; i += 2) {
    let sx = 0, sy = 0, n = 0;
    for (let j = Math.max(0, i - W); j <= Math.min(raw.length - 1, i + W); j++) { sx += raw[j][0]; sy += raw[j][1]; n++; }
    pts.push([sx / n + .5, sy / n + .5]);
  }
  $("river").setAttribute("d", "M" + pts.map(p => p.map(v => v.toFixed(1)).join(",")).join("L"));
}

// ---------- Touch: the lines light up tan ----------
function screenToGrid(x, y) {
  const m = svg.getScreenCTM();
  return [(x - m.e) / m.a, (y - m.f) / m.d];
}

// Draws the tan lines once at screen resolution, and the afterglow of every settled touch.
function layout() {
  if (!state) return;
  const dpr = devicePixelRatio || 1, w = Math.round(innerWidth * dpr), h = Math.round(innerHeight * dpr);
  const m = svg.getScreenCTM();
  tan.width = w; tan.height = h;
  tanLines = Object.assign(document.createElement("canvas"), { width: w, height: h });
  const c = tanLines.getContext("2d");
  c.setTransform(dpr * m.a, 0, 0, dpr * m.d, dpr * m.e, dpr * m.f);
  c.lineJoin = "round";
  c.strokeStyle = "#e2b97f"; c.lineWidth = 1.1 / m.a;
  for (const p of lines.minor) c.stroke(p);
  c.strokeStyle = "#ffe2b8"; c.lineWidth = 1.8 / m.a; c.shadowColor = "#e2b97f"; c.shadowBlur = 6 * dpr;
  for (const p of lines.major) c.stroke(p);
  settled = Object.assign(document.createElement("canvas"), { width: w, height: h });
  for (const s of spots) if (s.done) spot(settled.getContext("2d"), s, 1, REST);
  kick();
}

// A touch, as a mask: bright in the middle, soft at the edge.
function spot(c, s, open, glow) {
  const m = svg.getScreenCTM(), dpr = devicePixelRatio || 1;
  const x = (m.a * s.gx + m.e) * dpr, y = (m.d * s.gy + m.f) * dpr, r = R * dpr * (.35 + .65 * open);
  const g = c.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, `rgba(255,255,255,${glow})`);
  g.addColorStop(.45, `rgba(255,255,255,${glow * .85})`);
  g.addColorStop(1, "rgba(255,255,255,0)");
  c.fillStyle = g;
  c.fillRect(x - r, y - r, 2 * r, 2 * r);
}

function light(x, y) {
  const [gx, gy] = screenToGrid(x, y);
  spots.push({ gx, gy, t0: performance.now(), done: false });
  if (!touched) { touched = true; $("status").classList.add("gone"); }
  kick();
}

function kick() { if (!raf) raf = requestAnimationFrame(frame); }

function frame(now) {
  raf = 0;
  if (!tanLines) return;
  const dpr = devicePixelRatio || 1;
  let busy = false;
  tctx.globalCompositeOperation = "source-over";
  tctx.clearRect(0, 0, tan.width, tan.height);
  tctx.drawImage(settled, 0, 0);
  const blooms = [];
  for (const s of spots) {
    if (s.done) continue;
    const t = CALM ? Infinity : now - s.t0;
    const open = ease(clamp(t / BLOOM, 0, 1));
    const glow = t < BLOOM ? 1 : REST + (1 - REST) * (1 - ease(clamp((t - BLOOM) / SETTLE, 0, 1)));
    if (t >= BLOOM + SETTLE) { s.done = true; spot(settled.getContext("2d"), s, 1, REST); }
    else { busy = true; spot(tctx, s, open, glow); }
    if (t < BLOOM * 2.5) blooms.push([s, open, 1 - t / (BLOOM * 2.5)]);
  }
  // The mask, filled with the tan lines.
  tctx.globalCompositeOperation = "source-in";
  tctx.drawImage(tanLines, 0, 0);
  // A soft tan glow on the ground under a fresh touch.
  tctx.globalCompositeOperation = "source-over";
  const m = svg.getScreenCTM();
  for (const [s, open, a] of blooms) {
    const x = (m.a * s.gx + m.e) * dpr, y = (m.d * s.gy + m.f) * dpr, r = R * 1.3 * dpr * (.35 + .65 * open);
    const g = tctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, `rgba(226,185,127,${.35 * a})`);
    g.addColorStop(1, "rgba(226,185,127,0)");
    tctx.fillStyle = g;
    tctx.fillRect(x - r, y - r, 2 * r, 2 * r);
  }
  if (busy) kick();
}

svg.addEventListener("pointerdown", e => {
  if (!state || (e.pointerType === "mouse" && e.button !== 0)) return;
  svg.setPointerCapture(e.pointerId);
  press = { x: e.clientX, y: e.clientY };
  light(e.clientX, e.clientY);
});
svg.addEventListener("pointermove", e => {
  if (!press || Math.hypot(e.clientX - press.x, e.clientY - press.y) < GAP) return;
  press = { x: e.clientX, y: e.clientY };
  light(e.clientX, e.clientY);
});
const release = () => { press = null; };
svg.addEventListener("pointerup", release);
svg.addEventListener("pointercancel", release);

async function load() {
  $("status").textContent = "LOADING ELEVATION DATA…";
  try {
    render(await fetchElevation());
  } catch {
    $("status").innerHTML = `ELEVATION FEED UNREACHABLE<button class="retry" onclick="load()">RETRY</button>`;
  }
}

addEventListener("resize", layout);
load();
</script>
</body>
</html>
