<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Topo Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #04080a;
    --line: #3fd0c0;
    --major: #a8fff2;
    --accent: #ff6a3d;
    --text: #bdf5ee;
    --muted: #4f8f88;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; color: var(--text);
    font: 12px/1.45 "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; letter-spacing: .04em; }
  #map { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  #map.reveal { animation: reveal 2.6s cubic-bezier(.6,.05,.3,1) both; }
  @keyframes reveal { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
  #minor path { fill: none; stroke: var(--line); stroke-width: .8; vector-effect: non-scaling-stroke; }
  #major path { fill: none; stroke: var(--major); stroke-width: 1.4; vector-effect: non-scaling-stroke; }

  .overlay { position: fixed; inset: 0; pointer-events: none; }
  #grid { background-image:
      linear-gradient(rgba(63,208,192,.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(63,208,192,.07) 1px, transparent 1px);
    background-size: 80px 80px; background-position: center; }
  #fx { background:
      repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 1px, transparent 1px 3px),
      radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,.75) 100%); }
  #sweep { position: fixed; top: 0; bottom: 0; width: 2px; left: -4px; pointer-events: none;
    background: var(--major); box-shadow: 0 0 18px 4px rgba(63,208,192,.55); opacity: 0; }
  #sweep.run { animation: sweep 2.6s cubic-bezier(.6,.05,.3,1) both; }
  @keyframes sweep { 0% { left: 0; opacity: 1; } 95% { opacity: 1; } 100% { left: 100%; opacity: 0; } }

  .hx, .hy { position: fixed; pointer-events: none; background: rgba(168,255,242,.35); display: none; }
  .hx { left: 0; right: 0; height: 1px; }
  .hy { top: 0; bottom: 0; width: 1px; }

  .hud { position: fixed; padding: 18px 22px; pointer-events: none; text-shadow: 0 0 8px rgba(63,208,192,.5); }
  .tl { top: 0; left: 0; } .tr { top: 0; right: 0; text-align: right; }
  .bl { bottom: 0; left: 0; }
  .label { color: var(--muted); font-size: 10px; letter-spacing: .18em; }
  .title { font-size: clamp(20px, 3.4vw, 40px); font-weight: 600; letter-spacing: .08em; line-height: 1.1; margin: 4px 0; }
  .accent { color: var(--accent); text-shadow: 0 0 8px rgba(255,106,61,.6); }
  .blink { animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .scale { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .scale i { display: block; height: 6px; border: 1px solid var(--major); border-top: 0; }

  .corner { position: fixed; width: 26px; height: 26px; border: 2px solid var(--line); pointer-events: none; opacity: .8; }
  .c1 { top: 8px; left: 8px; border-right: 0; border-bottom: 0; }
  .c2 { top: 8px; right: 8px; border-left: 0; border-bottom: 0; }
  .c3 { bottom: 8px; left: 8px; border-right: 0; border-top: 0; }
  .c4 { bottom: 8px; right: 8px; border-left: 0; border-top: 0; }

  .marker { position: fixed; pointer-events: none; transform: translate(-50%, -50%); }
  .marker .ring { width: 22px; height: 22px; border: 1.5px solid var(--accent); border-radius: 50%;
    box-shadow: 0 0 10px rgba(255,106,61,.7); animation: pulse 1.8s ease-out infinite; }
  .marker .tag { position: absolute; left: 20px; top: -18px; white-space: nowrap; color: var(--accent);
    font-size: 11px; text-shadow: 0 0 8px rgba(255,106,61,.6); }
  @keyframes pulse { 0% { transform: scale(.6); opacity: 1; } 100% { transform: scale(1.8); opacity: 0; } }

  /* POI pings: 44px hit area around a small diamond core. */
  .ping { position: fixed; width: 44px; height: 44px; transform: translate(-50%, -50%); padding: 0; margin: 0;
    background: none; border: 0; cursor: pointer; opacity: 0; animation: pingIn .4s ease-out forwards; }
  .ping .core { position: absolute; left: 50%; top: 50%; width: 10px; height: 10px; margin: -5px 0 0 -5px;
    background: var(--major); transform: rotate(45deg); box-shadow: 0 0 10px 2px rgba(168,255,242,.7); transition: transform .2s; }
  .ping .wave { position: absolute; left: 50%; top: 50%; width: 40px; height: 40px; margin: -20px 0 0 -20px;
    border: 1.5px solid var(--major); border-radius: 50%; animation: wave 2.2s ease-out infinite; }
  .ping .wave + .wave { animation-delay: 1.1s; }
  .ping .id { position: absolute; left: 34px; top: 4px; white-space: nowrap; color: var(--major); font-size: 10px;
    letter-spacing: .14em; text-shadow: 0 0 8px rgba(168,255,242,.6); }
  .ping.flip .id { left: auto; right: 34px; }
  .ping:hover .core, .ping:focus-visible .core { transform: rotate(45deg) scale(1.4); }
  .ping:focus-visible { outline: 1px dashed var(--major); outline-offset: 2px; }
  .ping.active .core { background: var(--accent); box-shadow: 0 0 12px 3px rgba(255,106,61,.8); transform: rotate(45deg) scale(1.4); }
  .ping.active .wave { border-color: var(--accent); }
  .ping.active .id { color: var(--accent); text-shadow: 0 0 8px rgba(255,106,61,.6); }
  @keyframes wave { 0% { transform: scale(.2); opacity: 1; } 100% { transform: scale(1.4); opacity: 0; } }
  @keyframes pingIn { from { opacity: 0; transform: translate(-50%, -50%) scale(2.5); } to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }

  #panel { position: fixed; top: 50%; right: 22px; width: min(360px, calc(100vw - 32px)); max-height: calc(100vh - 140px);
    overflow-y: auto; box-sizing: border-box; padding: 18px 20px 20px; background: rgba(4,10,12,.88);
    border: 1px solid var(--line); box-shadow: 0 0 24px rgba(63,208,192,.25), inset 0 0 30px rgba(63,208,192,.06);
    backdrop-filter: blur(4px); transform: translate(calc(100% + 40px), -50%); transition: transform .35s cubic-bezier(.3,.7,.2,1); }
  #panel.open { transform: translate(0, -50%); }
  #panel::before { content: ""; position: absolute; top: -1px; left: -1px; width: 14px; height: 14px;
    border-top: 2px solid var(--accent); border-left: 2px solid var(--accent); }
  #panel h2 { margin: 4px 0 2px; font-size: 20px; letter-spacing: .08em; color: var(--major); text-shadow: 0 0 10px rgba(168,255,242,.5); }
  #panel p { margin: 12px 0 0; color: var(--text); line-height: 1.6; }
  #panel dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 14px 0 0; padding: 12px 0;
    border-top: 1px solid rgba(63,208,192,.25); border-bottom: 1px solid rgba(63,208,192,.25); }
  #panel dt { color: var(--muted); font-size: 10px; letter-spacing: .16em; align-self: center; }
  #panel dd { margin: 0; text-align: right; }
  #panel ul { margin: 12px 0 0; padding: 0; list-style: none; }
  #panel li { padding-left: 16px; position: relative; margin-top: 6px; line-height: 1.5; }
  #panel li::before { content: "▸"; position: absolute; left: 0; color: var(--accent); }
  #close { position: absolute; top: 10px; right: 10px; width: 32px; height: 32px; font: inherit; font-size: 16px;
    color: var(--text); background: none; border: 1px solid var(--muted); cursor: pointer; }
  #close:hover { border-color: var(--major); color: var(--major); }
  .retry { pointer-events: auto; font: inherit; color: var(--text); background: rgba(4,8,10,.6); border: 1px solid var(--accent);
    padding: 6px 12px; margin-top: 6px; cursor: pointer; letter-spacing: .1em; }

  @media (max-width: 640px) {
    .hud { padding: 14px 16px; }
    .tr { display: none; }
    #panel { top: auto; bottom: 0; right: 0; left: 0; width: 100%; max-height: 62vh; transform: translateY(105%);
      border-width: 1px 0 0; }
    #panel.open { transform: translateY(0); }
  }
</style>
</head>
<body>
<svg id="map" preserveAspectRatio="xMidYMid slice" aria-label="Topographic contour map of Twin Falls, Idaho">
  <defs>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g id="minor"></g>
  <g id="major" filter="url(#glow)"></g>
</svg>
<div id="grid" class="overlay"></div>
<div id="sweep"></div>
<div class="hx"></div><div class="hy"></div>
<div id="markers"></div>
<div id="fx" class="overlay"></div>
<div id="pings"></div>
<div class="corner c1"></div><div class="corner c2"></div><div class="corner c3"></div><div class="corner c4"></div>

<div class="hud tl">
  <div class="label">TOPOGRAPHIC SURVEY // SNAKE RIVER PLAIN</div>
  <div class="title">TWIN FALLS</div>
  <div class="label">SNAKE RIVER CANYON · IDAHO</div>
  <div id="coords"></div>
</div>
<div class="hud tr">
  <div class="label">ELEVATION RANGE</div>
  <div id="range">—</div>
  <div class="label" style="margin-top:8px">CONTOUR INTERVAL</div>
  <div id="interval">—</div>
  <div class="label" style="margin-top:8px">SOURCE</div>
  <div>AWS TERRAIN TILES<br><span id="grid-info" class="label"></span></div>
</div>
<div class="hud bl">
  <div id="status" class="accent blink">ACQUIRING ELEVATION DATA…</div>
  <div id="cursor" class="label">TAP A PING FOR INTEL</div>
  <div class="scale"><i id="scalebar"></i><span id="scaletext"></span></div>
</div>

<aside id="panel" aria-live="polite" aria-hidden="true">
  <button id="close" aria-label="Close panel">×</button>
  <div class="label" id="p-id"></div>
  <h2 id="p-name"></h2>
  <div class="label" id="p-kind"></div>
  <dl>
    <dt>LAT / LON</dt><dd id="p-coords"></dd>
    <dt>ELEVATION</dt><dd id="p-elev"></dd>
    <dt>FROM CENTER</dt><dd id="p-range"></dd>
  </dl>
  <p id="p-desc"></p>
  <ul id="p-facts"></ul>
</aside>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
// Elevation: AWS Terrain Tiles (Mapzen terrarium encoding), public and CORS-enabled.
const TILE_URL = "https://s3.amazonaws.com/elevation-tiles-prod/terrarium";
const LOC = { lat: 42.5940, lon: -114.4060, step: 5 };

const POIS = [
  { name: "PERRINE BRIDGE", kind: "STRUCTURE · US-93", lat: 42.6005, lon: -114.4552,
    desc: "A 1,500 ft steel truss bridge carrying US-93 across the Snake River Canyon, about 486 ft above the water. Main gateway into Twin Falls from the north.",
    facts: ["Opened 1976, replacing the original 1927 bridge", "One of the few man-made structures in the US where BASE jumping is legal year-round without a permit", "Rim walkway and visitor center on the south end"] },
  { name: "SHOSHONE FALLS", kind: "WATERFALL · SNAKE RIVER", lat: 42.5952, lon: -114.4009,
    desc: "The \"Niagara of the West.\" The Snake River drops 212 ft over a rim roughly 900 ft wide, which is taller than Niagara Falls.",
    facts: ["Flow peaks in spring before irrigation diversions upstream", "Carved during the Bonneville Flood about 14,500 years ago", "City park with overlooks on the south rim"] },
  { name: "KNIEVEL JUMP SITE", kind: "HISTORIC SITE · SOUTH RIM", lat: 42.5945, lon: -114.4170,
    desc: "On Sept 8, 1974, Evel Knievel tried to jump the canyon in the steam-powered Skycycle X-2. The parachute deployed early and he drifted down to the riverbank.",
    facts: ["The dirt launch ramp mound still stands on the south rim", "Stuntman Eddie Braun made the jump successfully in 2016 with a replica rocket", "Position approximate"] },
  { name: "PILLAR FALLS", kind: "GEOLOGY · RIVER CHANNEL", lat: 42.5992, lon: -114.4385,
    desc: "A cluster of rhyolite pillars rising out of the river between the Perrine Bridge and Shoshone Falls, with water cascading between the columns.",
    facts: ["Reached by kayak or SUP from Centennial Waterfront Park", "Also visible via a short hike down from the north rim", "Popular climbing area on the surrounding walls"] },
  { name: "TWIN FALLS", kind: "WATERFALL · NAMESAKE", lat: 42.5880, lon: -114.3567,
    desc: "The waterfall the city is named after. Originally two parallel falls; a 1935 hydroelectric dam diverted one channel, so usually only one fall runs.",
    facts: ["Drops roughly 125 ft into the canyon", "Operated by Idaho Power as a hydro project", "Small park and overlook on the south rim"] },
];

const svg = document.getElementById("map");
const $ = id => document.getElementById(id);
let state = null;

const lon2tile = (lon, z) => (lon + 180) / 360 * 2 ** z;
const lat2tile = (lat, z) => { const r = lat * Math.PI / 180; return (1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * 2 ** z; };
function pix2lonlat(px, py, z) {
  const n = 256 * 2 ** z;
  return [px / n * 360 - 180, Math.atan(Math.sinh(Math.PI * (1 - 2 * py / n))) * 180 / Math.PI];
}
const fmtLat = v => `${Math.abs(v).toFixed(4)}°${v >= 0 ? "N" : "S"}`;
const fmtLon = v => `${Math.abs(v).toFixed(4)}°${v >= 0 ? "E" : "W"}`;
const fmtM = v => `${Math.round(v).toLocaleString()} m`;

function loadImg(url) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = url;
  });
}

// Pixel window sized to the viewport aspect, centered exactly on the location.
// Landscape screens get zoom 13 so the POIs spread out; portrait needs zoom 12 to fit them all.
function tileWindow() {
  const z = innerWidth >= innerHeight ? 13 : 12;
  const rows = 3, cols = Math.max(3, Math.min(7, Math.ceil(rows * innerWidth / innerHeight)));
  const W = cols * 256, H = rows * 256;
  const ox = Math.round(lon2tile(LOC.lon, z) * 256 - W / 2);
  const oy = Math.round(lat2tile(LOC.lat, z) * 256 - H / 2);
  const ds = Math.max(1, Math.ceil(Math.sqrt(W * H / 320000)));
  return { z, cols, W, H, ox, oy, ds, gw: Math.floor(W / ds), gh: Math.floor(H / ds) };
}

async function fetchElevation() {
  const { z, cols, W, H, ox, oy, ds, gw, gh } = tileWindow();
  const canvas = document.createElement("canvas");
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext("2d", { willReadFrequently: true });
  const jobs = [];
  for (let ty = Math.floor(oy / 256); ty * 256 < oy + H; ty++) for (let tx = Math.floor(ox / 256); tx * 256 < ox + W; tx++) {
    jobs.push(loadImg(`${TILE_URL}/${z}/${tx}/${ty}.png`).then(img => ctx.drawImage(img, tx * 256 - ox, ty * 256 - oy)));
  }
  await Promise.all(jobs);
  const px = ctx.getImageData(0, 0, W, H).data;
  const values = new Float64Array(gw * gh);
  for (let y = 0; y < gh; y++) for (let x = 0; x < gw; x++) {
    const i = ((y * ds) * W + x * ds) * 4;
    values[y * gw + x] = px[i] * 256 + px[i + 1] + px[i + 2] / 256 - 32768;
  }
  return { values, z, cols, gw, gh, ds, ox, oy };
}

const toGrid = (lat, lon) => [(lon2tile(lon, state.z) * 256 - state.ox) / state.ds, (lat2tile(lat, state.z) * 256 - state.oy) / state.ds];
const sample = ([gx, gy]) => state.values[Math.min(state.gh - 1, Math.max(0, Math.round(gy))) * state.gw + Math.min(state.gw - 1, Math.max(0, Math.round(gx)))];

function render(d) {
  const { gw, gh } = d;
  d3.blur2({ data: d.values, width: gw, height: gh }, 1);
  let min = Infinity, max = -Infinity, maxI = 0;
  for (let i = 0; i < d.values.length; i++) {
    const v = d.values[i];
    if (v < min) min = v;
    if (v > max) { max = v; maxI = i; }
  }
  const step = LOC.step;
  const thresholds = d3.range(Math.ceil(min / step) * step, max, step);
  const contours = d3.contours().size([gw, gh]).thresholds(thresholds)(d.values);
  const isMajor = v => Math.abs(v / (step * 5) - Math.round(v / (step * 5))) < 1e-6;
  const opacity = v => 0.25 + 0.75 * (v - min) / (max - min || 1);
  const path = d3.geoPath();

  svg.setAttribute("viewBox", `0 0 ${gw} ${gh}`);
  d3.select("#minor").selectAll("path").data(contours.filter(c => !isMajor(c.value)))
    .join("path").attr("d", path).attr("stroke-opacity", c => opacity(c.value) * 0.7);
  d3.select("#major").selectAll("path").data(contours.filter(c => isMajor(c.value)))
    .join("path").attr("d", path).attr("stroke-opacity", c => opacity(c.value));

  state = { ...d, min, max, peak: [maxI % gw, Math.floor(maxI / gw)] };

  $("range").textContent = `${fmtM(min)} → ${fmtM(max)}`;
  $("interval").textContent = `${step} m · INDEX ${step * 5} m`;
  $("grid-info").textContent = `ZOOM ${d.z} · ${gw}×${gh} GRID`;
  $("status").textContent = "LOCK ACQUIRED";
  $("status").classList.remove("blink");

  for (const el of [svg, $("sweep")]) {
    const cls = el === svg ? "reveal" : "run";
    el.classList.remove(cls); void el.getBoundingClientRect(); el.classList.add(cls);
  }
  buildPings();
  placeMarkers();
}

function toScreen(gx, gy) {
  const m = svg.getScreenCTM();
  return [m.a * gx + m.e, m.d * gy + m.f];
}

const mPerGrid = () => 40075016 * Math.cos(LOC.lat * Math.PI / 180) / (256 * 2 ** state.z) * state.ds;

function buildPings() {
  $("pings").innerHTML = POIS.map((p, i) => `
    <button class="ping" data-i="${i}" style="animation-delay:${2.4 + i * 0.15}s" aria-label="${p.name}">
      <span class="wave"></span><span class="wave"></span><span class="core"></span>
      <span class="id">POI-${String(i + 1).padStart(2, "0")}</span>
    </button>`).join("");
  $("pings").querySelectorAll(".ping").forEach(b => b.addEventListener("click", e => { e.stopPropagation(); openPanel(+b.dataset.i); }));
}

function placeMarkers() {
  if (!state) return;
  const [px, py] = toScreen(...state.peak);
  $("markers").innerHTML = `
    <div class="marker" style="left:${px}px;top:${py}px"><div class="ring"></div>
      <div class="tag">▲ PEAK ${fmtM(state.max)}</div></div>`;
  $("pings").querySelectorAll(".ping").forEach(b => {
    const p = POIS[+b.dataset.i];
    const [x, y] = toScreen(...toGrid(p.lat, p.lon));
    b.style.left = `${x}px`; b.style.top = `${y}px`;
    b.classList.toggle("flip", x > innerWidth - 100);
  });

  // Scale bar: ground metres per screen pixel at this latitude.
  const mPerPx = mPerGrid() / svg.getScreenCTM().a;
  const p = 10 ** Math.floor(Math.log10(mPerPx * 120));
  const dist = [1, 2, 2.5, 5, 10].map(m => m * p).find(v => v >= mPerPx * 120);
  $("scalebar").style.width = `${dist / mPerPx}px`;
  $("scaletext").textContent = dist >= 1000 ? `${dist / 1000} km` : `${dist} m`;
}

function openPanel(i) {
  const p = POIS[i];
  const g = toGrid(p.lat, p.lon), c = toGrid(LOC.lat, LOC.lon);
  const dx = g[0] - c[0], dy = g[1] - c[1];
  const dist = Math.hypot(dx, dy) * mPerGrid();
  const brg = (Math.atan2(dx, -dy) * 180 / Math.PI + 360) % 360;
  $("p-id").textContent = `POI-${String(i + 1).padStart(2, "0")} // INTEL`;
  $("p-name").textContent = p.name;
  $("p-kind").textContent = p.kind;
  $("p-coords").textContent = `${fmtLat(p.lat)} ${fmtLon(p.lon)}`;
  $("p-elev").textContent = fmtM(sample(g));
  $("p-range").textContent = `${(dist / 1000).toFixed(2)} km · ${String(Math.round(brg)).padStart(3, "0")}°`;
  $("p-desc").textContent = p.desc;
  $("p-facts").innerHTML = p.facts.map(f => `<li>${f}</li>`).join("");
  $("pings").querySelectorAll(".ping").forEach(b => b.classList.toggle("active", +b.dataset.i === i));
  $("panel").classList.add("open");
  $("panel").setAttribute("aria-hidden", "false");
}

function closePanel() {
  $("panel").classList.remove("open");
  $("panel").setAttribute("aria-hidden", "true");
  $("pings").querySelectorAll(".ping").forEach(b => b.classList.remove("active"));
}

svg.addEventListener("pointermove", e => {
  if (!state) return;
  const m = svg.getScreenCTM();
  const gx = (e.clientX - m.e) / m.a, gy = (e.clientY - m.f) / m.d;
  if (gx < 0 || gy < 0 || gx >= state.gw || gy >= state.gh) return;
  const [lon, lat] = pix2lonlat(state.ox + gx * state.ds, state.oy + gy * state.ds, state.z);
  $("cursor").textContent = `LAT ${fmtLat(lat)} · LON ${fmtLon(lon)} · ELEV ${fmtM(sample([gx, gy]))}`;
  document.querySelector(".hx").style.cssText = `display:block;top:${e.clientY}px`;
  document.querySelector(".hy").style.cssText = `display:block;left:${e.clientX}px`;
});
svg.addEventListener("pointerleave", () => {
  document.querySelector(".hx").style.display = document.querySelector(".hy").style.display = "none";
});
svg.addEventListener("click", closePanel);
$("close").addEventListener("click", closePanel);
addEventListener("keydown", e => { if (e.key === "Escape") closePanel(); });

async function load() {
  $("coords").textContent = `${fmtLat(LOC.lat)}  ${fmtLon(LOC.lon)}`;
  $("status").textContent = "ACQUIRING ELEVATION DATA…";
  $("status").classList.add("blink");
  try {
    render(await fetchElevation());
  } catch {
    $("status").innerHTML = `SIGNAL LOST — ELEVATION FEED UNREACHABLE<br><button class="retry" onclick="load()">RETRY</button>`;
    $("status").classList.remove("blink");
  }
}

// Re-fetch when the viewport shape changes enough to need a different tile window.
let resizeTimer;
addEventListener("resize", () => {
  placeMarkers();
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { if (state) { const w = tileWindow(); if (w.cols !== state.cols || w.z !== state.z) load(); } }, 300);
});
load();
