<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Topo Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #04080a;
    --line: #3fd0c0;
    --major: #a8fff2;
    --accent: #ff6a3d;
    --text: #bdf5ee;
    --muted: #4f8f88;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; color: var(--text);
    font: 12px/1.45 "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; letter-spacing: .04em; }
  .layer { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  #map.reveal { animation: reveal 2.6s cubic-bezier(.6,.05,.3,1) both; }
  @keyframes reveal { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
  #minor path { fill: none; stroke: var(--line); stroke-width: .8; vector-effect: non-scaling-stroke; }
  #major path { fill: none; stroke: var(--major); stroke-width: 1.4; vector-effect: non-scaling-stroke; }

  /* Radar sweep, lit contours and river all draw into one canvas (#fxc) each frame. */
  #fxc { pointer-events: none; }
  #rings { pointer-events: none;
    background: repeating-radial-gradient(circle at 50% 50%, transparent 0 139px, rgba(63,208,192,.09) 139px 140px); }

  .late { opacity: 0; transition: opacity 1s; }
  body.live .late { opacity: 1; }

  .overlay { position: fixed; inset: 0; pointer-events: none; }
  #grid { background-image:
      linear-gradient(rgba(63,208,192,.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(63,208,192,.07) 1px, transparent 1px);
    background-size: 80px 80px; background-position: center; }
  #fx { background:
      repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 1px, transparent 1px 3px),
      radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,.75) 100%); }
  #sweep { position: fixed; top: 0; bottom: 0; width: 2px; left: -4px; pointer-events: none;
    background: var(--major); box-shadow: 0 0 18px 4px rgba(63,208,192,.55); opacity: 0; }
  #sweep.run { animation: sweep 2.6s cubic-bezier(.6,.05,.3,1) both; }
  @keyframes sweep { 0% { left: 0; opacity: 1; } 95% { opacity: 1; } 100% { left: 100%; opacity: 0; } }

  .hx, .hy { position: fixed; pointer-events: none; background: rgba(168,255,242,.35); display: none; }
  .hx { left: 0; right: 0; height: 1px; }
  .hy { top: 0; bottom: 0; width: 1px; }

  .hud { position: fixed; padding: 18px 22px; pointer-events: none; text-shadow: 0 0 8px rgba(63,208,192,.5); }
  .tl { top: 0; left: 0; } .tr { top: 0; right: 0; text-align: right; }
  .bl { bottom: 0; left: 0; } .br { bottom: 0; right: 0; text-align: right; }
  .label { color: var(--muted); font-size: 10px; letter-spacing: .18em; }
  .title { font-size: clamp(20px, 3.4vw, 40px); font-weight: 600; letter-spacing: .08em; line-height: 1.1; margin: 4px 0; }
  .accent { color: var(--accent); text-shadow: 0 0 8px rgba(255,106,61,.6); }
  .blink { animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .scale { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .scale i { display: block; height: 6px; border: 1px solid var(--major); border-top: 0; }
  #log { font-size: 10px; letter-spacing: .12em; color: var(--muted); min-height: 7.5em; }
  #log div { animation: logIn .4s ease-out; }
  #log div:last-child { color: var(--text); }
  @keyframes logIn { from { opacity: 0; transform: translateX(8px); } }

  .corner { position: fixed; width: 26px; height: 26px; border: 2px solid var(--line); pointer-events: none; opacity: .8; }
  .c1 { top: 8px; left: 8px; border-right: 0; border-bottom: 0; }
  .c2 { top: 8px; right: 8px; border-left: 0; border-bottom: 0; }
  .c3 { bottom: 8px; left: 8px; border-right: 0; border-top: 0; }
  .c4 { bottom: 8px; right: 8px; border-left: 0; border-top: 0; }

  .marker { position: fixed; pointer-events: none; transform: translate(-50%, -50%); }
  .marker .ring { width: 22px; height: 22px; border: 1.5px solid var(--accent); border-radius: 50%;
    box-shadow: 0 0 10px rgba(255,106,61,.7); animation: pulse 1.8s ease-out infinite; }
  .marker .tag { position: absolute; left: 20px; top: -18px; white-space: nowrap; color: var(--accent);
    font-size: 11px; text-shadow: 0 0 8px rgba(255,106,61,.6); }
  @keyframes pulse { 0% { transform: scale(.6); opacity: 1; } 100% { transform: scale(1.8); opacity: 0; } }

  /* POI pings: 44px hit area around a small diamond core. */
  .ping { position: fixed; width: 44px; height: 44px; transform: translate(-50%, -50%); padding: 0; margin: 0;
    background: none; border: 0; cursor: pointer; opacity: 0; animation: pingIn .4s ease-out forwards; }
  .ping .core { position: absolute; left: 50%; top: 50%; width: 10px; height: 10px; margin: -5px 0 0 -5px;
    background: var(--major); transform: rotate(45deg); box-shadow: 0 0 10px 2px rgba(168,255,242,.7); transition: transform .2s; }
  .ping .wave { position: absolute; left: 50%; top: 50%; width: 40px; height: 40px; margin: -20px 0 0 -20px;
    border: 1.5px solid var(--major); border-radius: 50%; animation: wave 2.2s ease-out infinite; }
  .ping .wave + .wave { animation-delay: 1.1s; }
  .ping .burst { position: absolute; left: 50%; top: 50%; width: 60px; height: 60px; margin: -30px 0 0 -30px;
    border: 2px solid #fff; border-radius: 50%; opacity: 0; pointer-events: none; }
  .ping.hit .burst { animation: burst .9s ease-out; }
  .ping.hit .core { animation: flash .9s ease-out; }
  .ping .id { position: absolute; left: 34px; top: 4px; white-space: nowrap; color: var(--major); font-size: 10px;
    letter-spacing: .14em; text-shadow: 0 0 8px rgba(168,255,242,.6); }
  .ping.flip .id { left: auto; right: 34px; }
  .ping:hover .core, .ping:focus-visible .core { transform: rotate(45deg) scale(1.4); }
  .ping:focus-visible { outline: 1px dashed var(--major); outline-offset: 2px; }
  .ping.active .core { background: var(--accent); box-shadow: 0 0 12px 3px rgba(255,106,61,.8); transform: rotate(45deg) scale(1.4); }
  .ping.active .wave { border-color: var(--accent); }
  .ping.active .id { opacity: 0; }
  @keyframes wave { 0% { transform: scale(.2); opacity: 1; } 100% { transform: scale(1.4); opacity: 0; } }
  @keyframes burst { 0% { transform: scale(.1); opacity: 1; } 100% { transform: scale(1.3); opacity: 0; } }
  @keyframes flash { 0% { background: #fff; box-shadow: 0 0 22px 8px rgba(255,255,255,.9); } }
  @keyframes pingIn { from { opacity: 0; transform: translate(-50%, -50%) scale(2.5); } to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }

  /* POI callout: a leader line from the ping into a frameless readout. */
  #leader { pointer-events: none; overflow: visible; }
  #leader path { fill: none; stroke: var(--accent); stroke-width: 1; stroke-dasharray: 1; stroke-dashoffset: 1;
    filter: drop-shadow(0 0 4px rgba(255,106,61,.7)); }
  #leader circle { fill: var(--accent); opacity: 0; }
  #leader.on path { stroke-dashoffset: 0; transition: stroke-dashoffset .35s cubic-bezier(.5,0,.2,1); }
  #leader.on circle { opacity: 1; transition: opacity .1s .3s; }

  #panel { position: fixed; left: 0; top: 0; width: 300px; padding: 2px 0 14px 16px; box-sizing: border-box;
    border-left: 1px solid var(--accent); pointer-events: none; visibility: hidden;
    background: linear-gradient(90deg, rgba(4,8,10,.82), rgba(4,8,10,.6) 75%, rgba(4,8,10,0));
    text-shadow: 0 0 8px rgba(63,208,192,.4); clip-path: inset(0 100% 0 0); }
  #panel.open { visibility: visible; pointer-events: auto; clip-path: inset(0 0 0 0);
    transition: clip-path .45s cubic-bezier(.5,0,.2,1) .3s; }
  #panel::before, #panel::after { content: ""; position: absolute; left: -1px; width: 8px; border-top: 1px solid var(--accent); }
  #panel::before { top: 0; } #panel::after { bottom: 0; }
  #panel h2 { margin: 2px 0 0; font-size: 18px; font-weight: 600; letter-spacing: .1em; color: var(--major);
    text-shadow: 0 0 10px rgba(168,255,242,.5); }
  #panel dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; margin: 10px 0 0; font-size: 11px; }
  #panel dt { color: var(--muted); font-size: 9px; letter-spacing: .18em; align-self: center; }
  #panel dd { margin: 0; color: var(--text); }
  #panel p { margin: 10px 0 0; font-size: 11px; line-height: 1.6; color: rgba(189,245,238,.78); }
  #panel ol { margin: 8px 0 0; padding: 0; list-style: none; font-size: 11px; line-height: 1.5; color: rgba(189,245,238,.78); }
  #panel li { display: grid; grid-template-columns: 22px 1fr; margin-top: 4px; }
  #panel li b { font-weight: 400; color: var(--accent); }
  #panel.open .seq { animation: seqIn .4s ease-out both; }
  @keyframes seqIn { from { opacity: 0; transform: translateX(-6px); } }
  #close { margin-top: 12px; padding: 0; font: inherit; font-size: 9px; letter-spacing: .2em; color: var(--muted);
    background: none; border: 0; cursor: pointer; }
  #close:hover { color: var(--major); }
  .retry { pointer-events: auto; font: inherit; color: var(--text); background: rgba(4,8,10,.6); border: 1px solid var(--accent);
    padding: 6px 12px; margin-top: 6px; cursor: pointer; letter-spacing: .1em; }

  @media (max-width: 640px) {
    .hud { padding: 14px 16px; }
    .tr, .br { display: none; }
    #panel { width: auto; right: 0; padding: 14px 16px 18px; border-left: 0; border-top: 1px solid var(--accent);
      background: linear-gradient(180deg, rgba(4,8,10,.75), rgba(4,8,10,.92) 40%); }
    #panel::before, #panel::after { display: none; }
    body.callout .bl { opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    #fxc, #rings { display: none; }
  }
</style>
</head>
<body>
<svg id="map" class="layer" preserveAspectRatio="xMidYMid slice" aria-label="Topographic contour map of Twin Falls, Idaho">
  <defs>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g id="minor"></g>
  <g id="major" filter="url(#glow)"></g>
</svg>
<canvas id="fxc" class="layer late" aria-hidden="true"></canvas>
<div id="grid" class="overlay"></div>
<div id="rings" class="overlay late"></div>
<div id="sweep"></div>
<div class="hx"></div><div class="hy"></div>
<div id="markers"></div>
<div id="fx" class="overlay"></div>
<div id="pings"></div>
<div class="corner c1"></div><div class="corner c2"></div><div class="corner c3"></div><div class="corner c4"></div>

<div class="hud tl">
  <div class="label">TOPOGRAPHIC SURVEY // SNAKE RIVER PLAIN</div>
  <div class="title">TWIN FALLS</div>
  <div class="label">SNAKE RIVER CANYON · IDAHO</div>
  <div id="coords"></div>
</div>
<div class="hud tr">
  <div class="label">ELEVATION RANGE</div>
  <div id="range">—</div>
  <div class="label" style="margin-top:8px">CONTOUR INTERVAL</div>
  <div id="interval">—</div>
  <div class="label" style="margin-top:8px">SOURCE</div>
  <div>AWS TERRAIN TILES<br><span id="grid-info" class="label"></span></div>
</div>
<div class="hud bl">
  <div id="status" class="accent blink">ACQUIRING ELEVATION DATA…</div>
  <div id="cursor" class="label">TAP A PING FOR INTEL</div>
  <div class="scale"><i id="scalebar"></i><span id="scaletext"></span></div>
</div>
<div class="hud br">
  <div class="label" style="margin-bottom:4px">TELEMETRY</div>
  <div id="log"></div>
</div>

<svg id="leader" class="layer" aria-hidden="true"><path pathLength="1"></path><circle r="2.5"></circle></svg>
<aside id="panel" aria-live="polite" aria-hidden="true">
  <div class="label" id="p-id"></div>
  <h2 id="p-name"></h2>
  <div class="label" id="p-kind"></div>
  <dl>
    <dt>POS</dt><dd id="p-coords"></dd>
    <dt>ELEV</dt><dd id="p-elev"></dd>
    <dt>RANGE</dt><dd id="p-range"></dd>
  </dl>
  <p id="p-desc" class="seq"></p>
  <ol id="p-facts"></ol>
  <button id="close" class="seq">[ ESC ] CLOSE</button>
</aside>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
// Elevation: AWS Terrain Tiles (Mapzen terrarium encoding), public and CORS-enabled.
const TILE_URL = "https://s3.amazonaws.com/elevation-tiles-prod/terrarium";
const LOC = { lat: 42.5940, lon: -114.4060, step: 5 };
const SWEEP_MS = 7000, TOUR_IDLE_MS = 12000, TOUR_HOLD_MS = 7000, PARTICLES = 70;
const CALM = matchMedia("(prefers-reduced-motion: reduce)").matches;

const POIS = [
  { name: "PERRINE BRIDGE", kind: "STRUCTURE · US-93", lat: 42.6005, lon: -114.4552,
    desc: "A 1,500 ft steel truss bridge carrying US-93 across the Snake River Canyon, about 486 ft above the water. Main gateway into Twin Falls from the north.",
    facts: ["Opened 1976, replacing the original 1927 bridge", "One of the few man-made structures in the US where BASE jumping is legal year-round without a permit", "Rim walkway and visitor center on the south end"] },
  { name: "SHOSHONE FALLS", kind: "WATERFALL · SNAKE RIVER", lat: 42.5952, lon: -114.4009,
    desc: "The \"Niagara of the West.\" The Snake River drops 212 ft over a rim roughly 900 ft wide, which is taller than Niagara Falls.",
    facts: ["Flow peaks in spring before irrigation diversions upstream", "Carved during the Bonneville Flood about 14,500 years ago", "City park with overlooks on the south rim"] },
  { name: "KNIEVEL JUMP SITE", kind: "HISTORIC SITE · SOUTH RIM", lat: 42.5945, lon: -114.4170,
    desc: "On Sept 8, 1974, Evel Knievel tried to jump the canyon in the steam-powered Skycycle X-2. The parachute deployed early and he drifted down to the riverbank.",
    facts: ["The dirt launch ramp mound still stands on the south rim", "Stuntman Eddie Braun made the jump successfully in 2016 with a replica rocket", "Position approximate"] },
  { name: "PILLAR FALLS", kind: "GEOLOGY · RIVER CHANNEL", lat: 42.5992, lon: -114.4385,
    desc: "A cluster of rhyolite pillars rising out of the river between the Perrine Bridge and Shoshone Falls, with water cascading between the columns.",
    facts: ["Reached by kayak or SUP from Centennial Waterfront Park", "Also visible via a short hike down from the north rim", "Popular climbing area on the surrounding walls"] },
  { name: "TWIN FALLS", kind: "WATERFALL · NAMESAKE", lat: 42.5880, lon: -114.3567,
    desc: "The waterfall the city is named after. Originally two parallel falls; a 1935 hydroelectric dam diverted one channel, so usually only one fall runs.",
    facts: ["Drops roughly 125 ft into the canyon", "Operated by Idaho Power as a hydro project", "Small park and overlook on the south rim"] },
];

const $ = id => document.getElementById(id);
const svg = $("map");
const fxc = $("fxc"), fx = fxc.getContext("2d");
const litc = document.createElement("canvas");
let dpr = 1, litPaths = [], litDirty = true;
let state = null;
let cam = null, tween = null;
let river = null, particles = [];
let pingPos = [];
let lastSweep = 0, sweepCount = 0, startTime = performance.now();
let touring = false, tourIdx = 0, tourTimer, idleTimer;

const lon2tile = (lon, z) => (lon + 180) / 360 * 2 ** z;
const lat2tile = (lat, z) => { const r = lat * Math.PI / 180; return (1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * 2 ** z; };
function pix2lonlat(px, py, z) {
  const n = 256 * 2 ** z;
  return [px / n * 360 - 180, Math.atan(Math.sinh(Math.PI * (1 - 2 * py / n))) * 180 / Math.PI];
}
const fmtLat = v => `${Math.abs(v).toFixed(4)}°${v >= 0 ? "N" : "S"}`;
const fmtLon = v => `${Math.abs(v).toFixed(4)}°${v >= 0 ? "E" : "W"}`;
const fmtM = v => `${Math.round(v).toLocaleString()} m`;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const ease = t => t < .5 ? 4 * t * t * t : 1 - (-2 * t + 2) ** 3 / 2;

function log(msg) {
  const s = Math.floor((performance.now() - startTime) / 1000);
  const line = document.createElement("div");
  line.textContent = `T+${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}  ${msg}`;
  $("log").append(line);
  while ($("log").children.length > 6) $("log").firstChild.remove();
}

function loadImg(url) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = url;
  });
}

// Pixel window sized to the viewport aspect, centered exactly on the location.
// Landscape screens get zoom 13 so the POIs spread out; portrait needs zoom 12 to fit them all.
function tileWindow() {
  const z = innerWidth >= innerHeight ? 13 : 12;
  const rows = 3, cols = Math.max(3, Math.min(7, Math.ceil(rows * innerWidth / innerHeight)));
  const W = cols * 256, H = rows * 256;
  const ox = Math.round(lon2tile(LOC.lon, z) * 256 - W / 2);
  const oy = Math.round(lat2tile(LOC.lat, z) * 256 - H / 2);
  const ds = Math.max(1, Math.ceil(Math.sqrt(W * H / 320000)));
  return { z, cols, W, H, ox, oy, ds, gw: Math.floor(W / ds), gh: Math.floor(H / ds) };
}

async function fetchElevation() {
  const { z, cols, W, H, ox, oy, ds, gw, gh } = tileWindow();
  const canvas = document.createElement("canvas");
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext("2d", { willReadFrequently: true });
  const jobs = [];
  for (let ty = Math.floor(oy / 256); ty * 256 < oy + H; ty++) for (let tx = Math.floor(ox / 256); tx * 256 < ox + W; tx++) {
    jobs.push(loadImg(`${TILE_URL}/${z}/${tx}/${ty}.png`).then(img => ctx.drawImage(img, tx * 256 - ox, ty * 256 - oy)));
  }
  await Promise.all(jobs);
  const px = ctx.getImageData(0, 0, W, H).data;
  const values = new Float64Array(gw * gh);
  for (let y = 0; y < gh; y++) for (let x = 0; x < gw; x++) {
    const i = ((y * ds) * W + x * ds) * 4;
    values[y * gw + x] = px[i] * 256 + px[i + 1] + px[i + 2] / 256 - 32768;
  }
  return { values, z, cols, gw, gh, ds, ox, oy };
}

const toGrid = (lat, lon) => [(lon2tile(lon, state.z) * 256 - state.ox) / state.ds, (lat2tile(lat, state.z) * 256 - state.oy) / state.ds];
const sample = ([gx, gy]) => state.values[clamp(Math.round(gy), 0, state.gh - 1) * state.gw + clamp(Math.round(gx), 0, state.gw - 1)];
const mPerGrid = () => 40075016 * Math.cos(LOC.lat * Math.PI / 180) / (256 * 2 ** state.z) * state.ds;

function render(d) {
  const { gw, gh } = d;
  d3.blur2({ data: d.values, width: gw, height: gh }, 1);
  let min = Infinity, max = -Infinity, maxI = 0;
  for (let i = 0; i < d.values.length; i++) {
    const v = d.values[i];
    if (v < min) min = v;
    if (v > max) { max = v; maxI = i; }
  }
  const step = LOC.step;
  const thresholds = d3.range(Math.ceil(min / step) * step, max, step);
  const contours = d3.contours().size([gw, gh]).thresholds(thresholds)(d.values);
  const isMajor = v => Math.abs(v / (step * 5) - Math.round(v / (step * 5))) < 1e-6;
  const opacity = v => 0.25 + 0.75 * (v - min) / (max - min || 1);
  const path = d3.geoPath();

  d3.select("#minor").selectAll("path").data(contours.filter(c => !isMajor(c.value)))
    .join("path").attr("d", path).attr("stroke-opacity", c => opacity(c.value) * 0.7);
  d3.select("#major").selectAll("path").data(contours.filter(c => isMajor(c.value)))
    .join("path").attr("d", path).attr("stroke-opacity", c => opacity(c.value));
  litPaths = contours.map(c => ({ p: new Path2D(path(c)), o: 0.35 + 0.65 * opacity(c.value) }));

  state = { ...d, min, max, peak: [maxI % gw, Math.floor(maxI / gw)] };
  cam = { cx: gw / 2, cy: gh / 2, k: 1 };
  tween = null;
  applyCam();

  $("range").textContent = `${fmtM(min)} → ${fmtM(max)}`;
  $("interval").textContent = `${step} m · INDEX ${step * 5} m`;
  $("grid-info").textContent = `ZOOM ${d.z} · ${gw}×${gh} GRID`;
  $("status").textContent = "LOCK ACQUIRED";
  $("status").classList.remove("blink");
  log(`ELEVATION GRID ${gw}×${gh} LOADED`);

  document.body.classList.remove("live");
  for (const el of [svg, $("sweep")]) {
    const cls = el === svg ? "reveal" : "run";
    el.classList.remove(cls); void el.getBoundingClientRect(); el.classList.add(cls);
  }
  setTimeout(() => document.body.classList.add("live"), 2600);
  buildPings();
  traceRiver();
  placeMarkers();
  armIdle();
}

// ---------- River: least-cost path through the elevation grid, east edge to west edge ----------
function traceRiver() {
  const { values, gw, gh, min } = state, N = gw * gh;
  const cost = new Float64Array(N);
  for (let i = 0; i < N; i++) cost[i] = (values[i] - min + 1) ** 2.5;
  const dist = new Float64Array(N).fill(Infinity), prev = new Int32Array(N).fill(-1);
  const hk = [], hv = [];
  const push = (k, v) => {
    let i = hk.length; hk.push(k); hv.push(v);
    while (i > 0) { const p = (i - 1) >> 1; if (hk[p] <= k) break; hk[i] = hk[p]; hv[i] = hv[p]; i = p; }
    hk[i] = k; hv[i] = v;
  };
  const pop = () => {
    const v = hv[0], k = hk.pop(), last = hv.pop(), n = hk.length;
    if (n) {
      let i = 0;
      for (;;) {
        let c = 2 * i + 1; if (c >= n) break;
        if (c + 1 < n && hk[c + 1] < hk[c]) c++;
        if (hk[c] >= k) break;
        hk[i] = hk[c]; hv[i] = hv[c]; i = c;
      }
      hk[i] = k; hv[i] = last;
    }
    return v;
  };
  // Sources: east edge plus the eastern quarter of top/bottom edges. Targets: the mirror on the west.
  const edge = gw >> 2;
  const isSource = (x, y) => x === gw - 1 || ((y === 0 || y === gh - 1) && x >= gw - edge);
  const isTarget = (x, y) => x === 0 || ((y === 0 || y === gh - 1) && x < edge);
  for (let y = 0; y < gh; y++) for (let x = 0; x < gw; x++) if (isSource(x, y)) {
    const i = y * gw + x; dist[i] = cost[i]; push(cost[i], i);
  }
  let end = -1;
  while (hk.length) {
    const d0 = hk[0], i = pop();
    if (d0 > dist[i]) continue;
    const x = i % gw, y = (i / gw) | 0;
    if (isTarget(x, y)) { end = i; break; }
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      if (!dx && !dy) continue;
      const nx = x + dx, ny = y + dy;
      if (nx < 0 || ny < 0 || nx >= gw || ny >= gh) continue;
      const j = ny * gw + nx, nd = d0 + cost[j] * (dx && dy ? Math.SQRT2 : 1);
      if (nd < dist[j]) { dist[j] = nd; prev[j] = i; push(nd, j); }
    }
  }
  if (end < 0) return;
  // Walk back from the west end, which yields points ordered east → west (downstream).
  const raw = [];
  for (let i = end; i >= 0; i = prev[i]) raw.push([i % gw, (i / gw) | 0]);
  raw.reverse();
  const W = 6, pts = [];
  for (let i = 0; i < raw.length; i += 2) {
    let sx = 0, sy = 0, n = 0;
    for (let j = Math.max(0, i - W); j <= Math.min(raw.length - 1, i + W); j++) { sx += raw[j][0]; sy += raw[j][1]; n++; }
    pts.push([sx / n + .5, sy / n + .5]);
  }
  const cum = [0];
  for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
  river = { pts, cum, len: cum[cum.length - 1], path: new Path2D("M" + pts.map(p => p.join(",")).join("L")) };

  particles = Array.from({ length: PARTICLES }, () => ({
    u: Math.random(), speed: 0.012 + Math.random() * 0.014, r: 0.5 + Math.random() * 0.8, off: (Math.random() - .5) * 2.5,
  }));

  const e0 = sample(pts[0]), e1 = sample(pts[pts.length - 1]);
  log(`RIVER TRACED · ${(river.len * mPerGrid() / 1000).toFixed(1)} KM · ${fmtM(e0)}→${fmtM(e1)}`);
}

function riverAt(u) {
  const s = u * river.len, { pts, cum } = river;
  let lo = 0, hi = cum.length - 1;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (cum[m] < s) lo = m; else hi = m; }
  const t = (s - cum[lo]) / (cum[hi] - cum[lo] || 1);
  const a = pts[lo], b = pts[hi];
  const nx = -(b[1] - a[1]), ny = b[0] - a[0], nl = Math.hypot(nx, ny) || 1;
  return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, nx / nl, ny / nl];
}

// ---------- Camera: the shared viewBox of all map layers ----------
function applyCam() {
  const w = state.gw / cam.k, h = state.gh / cam.k;
  const vb = `${cam.cx - w / 2} ${cam.cy - h / 2} ${w} ${h}`;
  svg.setAttribute("viewBox", vb);
  litDirty = true;
  placeMarkers();
}

const baseScale = () => Math.max(innerWidth / state.gw, innerHeight / state.gh);
const homeCam = () => ({ cx: state.gw / 2, cy: state.gh / 2, k: 1 });

// Zoom on a POI and park it where its callout has room: left of center on desktop, upper third on phones.
function poiCam(i) {
  const k = 1.8, s = baseScale() * k, mobile = innerWidth <= 640;
  const tx = mobile ? innerWidth / 2 : innerWidth * 0.36, ty = mobile ? innerHeight * 0.24 : innerHeight * 0.45;
  const [gx, gy] = toGrid(POIS[i].lat, POIS[i].lon);
  const hw = innerWidth / (2 * s), hh = innerHeight / (2 * s);
  return {
    cx: clamp(gx - (tx - innerWidth / 2) / s, hw, state.gw - hw),
    cy: clamp(gy - (ty - innerHeight / 2) / s, hh, state.gh - hh),
    k,
  };
}

function flyTo(target, ms = 1400) {
  if (!state) return;
  if (CALM) { cam = target; tween = null; applyCam(); return; }
  tween = { from: { ...cam }, to: target, t0: performance.now(), ms };
}

// ---------- Markers & pings ----------
function toScreen(gx, gy) {
  const m = svg.getScreenCTM();
  return [m.a * gx + m.e, m.d * gy + m.f];
}

function buildPings() {
  $("pings").innerHTML = POIS.map((p, i) => `
    <button class="ping" data-i="${i}" style="animation-delay:${2.4 + i * 0.15}s" aria-label="${p.name}">
      <span class="wave"></span><span class="wave"></span><span class="burst"></span><span class="core"></span>
      <span class="id">POI-${String(i + 1).padStart(2, "0")}</span>
    </button>`).join("");
  $("pings").querySelectorAll(".ping").forEach(b => b.addEventListener("click", e => { e.stopPropagation(); openPanel(+b.dataset.i); }));
}

function placeMarkers() {
  if (!state) return;
  const [px, py] = toScreen(...state.peak);
  if (!$("markers").firstElementChild) {
    $("markers").innerHTML = `<div class="marker"><div class="ring"></div><div class="tag"></div></div>`;
  }
  const peak = $("markers").firstElementChild;
  peak.style.left = `${px}px`; peak.style.top = `${py}px`;
  peak.querySelector(".tag").textContent = `▲ PEAK ${fmtM(state.max)}`;
  pingPos = [];
  $("pings").querySelectorAll(".ping").forEach(b => {
    const p = POIS[+b.dataset.i];
    const [x, y] = toScreen(...toGrid(p.lat, p.lon));
    pingPos[+b.dataset.i] = [x, y];
    b.style.left = `${x}px`; b.style.top = `${y}px`;
    b.classList.toggle("flip", x > innerWidth - 100);
  });
  placePanel();

  // Scale bar: ground metres per screen pixel at this latitude.
  const mPerPx = mPerGrid() / svg.getScreenCTM().a;
  const p = 10 ** Math.floor(Math.log10(mPerPx * 120));
  const dist = [1, 2, 2.5, 5, 10].map(m => m * p).find(v => v >= mPerPx * 120);
  $("scalebar").style.width = `${dist / mPerPx}px`;
  $("scaletext").textContent = dist >= 1000 ? `${dist / 1000} km` : `${dist} m`;
}

// ---------- Panel: leader-line callout anchored to the active ping ----------
let activePoi = -1;
const GLYPHS = "▓▒░<>/\\|#=+01";

// Decode text in left to right, with a band of noise glyphs ahead of the cursor.
function scramble(el, text, delay = 0, ms = 500) {
  const tok = el._tok = {}, t0 = performance.now() + delay;
  el.textContent = "";
  const tick = now => {
    if (el._tok !== tok) return;
    if (now < t0) return requestAnimationFrame(tick);
    const n = Math.floor(clamp((now - t0) / ms, 0, 1) * text.length);
    el.textContent = n >= text.length ? text : text.slice(0, n) +
      [...text.slice(n, n + 5)].map(c => c === " " ? " " : GLYPHS[Math.random() * GLYPHS.length | 0]).join("");
    if (n < text.length) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

function placePanel() {
  if (activePoi < 0 || !pingPos[activePoi]) return;
  const [x, y] = pingPos[activePoi], panel = $("panel");
  const w = panel.offsetWidth, h = panel.offsetHeight;
  let pts, left, top;
  if (innerWidth <= 640) {
    left = 0; top = Math.max(y + 70, innerHeight - h);
    pts = [[x, y + 12], [x, top]];
  } else {
    const flip = x + 100 + w > innerWidth - 16, dir = flip ? -1 : 1;
    top = clamp(y - 56, 16, innerHeight - h - 16);
    left = flip ? x - 100 - w : x + 100;
    pts = [[x + dir * 9, y - 9], [x + dir * 56, top], [flip ? left + w : left, top]];
  }
  panel.style.left = `${left}px`; panel.style.top = `${top}px`;
  $("leader").querySelector("path").setAttribute("d", "M" + pts.join("L"));
  const [ex, ey] = pts[pts.length - 1];
  $("leader").querySelector("circle").setAttribute("cx", ex);
  $("leader").querySelector("circle").setAttribute("cy", ey);
}

function openPanel(i) {
  const p = POIS[i], panel = $("panel"), leader = $("leader");
  const g = toGrid(p.lat, p.lon), c = toGrid(LOC.lat, LOC.lon);
  const dx = g[0] - c[0], dy = g[1] - c[1];
  const dist = Math.hypot(dx, dy) * mPerGrid();
  const brg = (Math.atan2(dx, -dy) * 180 / Math.PI + 360) % 360;
  const id = String(i + 1).padStart(2, "0");

  activePoi = i;
  panel.classList.remove("open"); leader.classList.remove("on");
  $("p-id").textContent = `CONTACT ${id} // ${p.kind.split(" · ")[0]}`;
  $("p-kind").textContent = p.kind.split(" · ")[1] || "";
  $("p-desc").textContent = p.desc;
  $("p-desc").style.animationDelay = ".75s";
  $("p-facts").innerHTML = p.facts.map((f, n) =>
    `<li class="seq" style="animation-delay:${.9 + n * .12}s"><b>${String(n + 1).padStart(2, "0")}</b><span>${f}</span></li>`).join("");
  $("close").style.animationDelay = `${.9 + p.facts.length * .12}s`;
  scramble($("p-name"), p.name, 350);
  scramble($("p-coords"), `${fmtLat(p.lat)} ${fmtLon(p.lon)}`, 500);
  scramble($("p-elev"), `${fmtM(sample(g))} ASL`, 580);
  scramble($("p-range"), `${(dist / 1000).toFixed(2)} km · BRG ${String(Math.round(brg)).padStart(3, "0")}°`, 660);
  $("pings").querySelectorAll(".ping").forEach(b => b.classList.toggle("active", +b.dataset.i === i));
  void panel.offsetWidth;
  placePanel();
  panel.classList.add("open"); leader.classList.add("on");
  document.body.classList.add("callout");
  panel.setAttribute("aria-hidden", "false");
  flyTo(poiCam(i));
}

function closePanel() {
  const wasOpen = activePoi >= 0;
  activePoi = -1;
  $("panel").classList.remove("open");
  $("leader").classList.remove("on");
  document.body.classList.remove("callout");
  $("panel").setAttribute("aria-hidden", "true");
  $("pings").querySelectorAll(".ping").forEach(b => b.classList.remove("active"));
  if (wasOpen) flyTo(homeCam());
}

// ---------- Idle tour ----------
function armIdle() {
  clearTimeout(idleTimer);
  if (!CALM) idleTimer = setTimeout(startTour, TOUR_IDLE_MS);
}

function startTour() {
  if (!state) return;
  touring = true;
  log("NO INPUT · AUTO-RECON ENGAGED");
  $("status").classList.add("blink");
  tourStep();
}

function tourStep() {
  if (!touring) return;
  $("status").textContent = `AUTO-RECON ▸ POI-${String(tourIdx + 1).padStart(2, "0")}`;
  log(`RECON POI-${String(tourIdx + 1).padStart(2, "0")} ${POIS[tourIdx].name}`);
  openPanel(tourIdx);
  tourIdx = (tourIdx + 1) % POIS.length;
  tourTimer = setTimeout(tourStep, TOUR_HOLD_MS);
}

function stopTour() {
  touring = false;
  clearTimeout(tourTimer);
  $("status").textContent = "LOCK ACQUIRED";
  $("status").classList.remove("blink");
  log("MANUAL CONTROL RESTORED");
  closePanel();
}

function onInput() {
  if (touring) stopTour();
  armIdle();
}
for (const ev of ["pointerdown", "pointermove", "keydown", "wheel"]) addEventListener(ev, onInput, { passive: true });

// ---------- Frame loop: camera tween, radar sweep, river particles ----------
function frame(now) {
  requestAnimationFrame(frame);
  if (!state) return;

  if (tween) {
    const t = Math.min(1, (now - tween.t0) / tween.ms), e = ease(t), { from, to } = tween;
    // Interpolate zoom in log space so the motion feels even.
    cam = { cx: from.cx + (to.cx - from.cx) * e, cy: from.cy + (to.cy - from.cy) * e, k: from.k * (to.k / from.k) ** e };
    applyCam();
    if (t === 1) tween = null;
  }
  if (CALM) return;

  const a = (now % SWEEP_MS) / SWEEP_MS * 360;
  drawFx(now, a);
  if (document.body.classList.contains("live")) {
    const swept = (a - lastSweep + 360) % 360, cx = innerWidth / 2, cy = innerHeight / 2;
    pingPos.forEach(([x, y], i) => {
      const ang = (Math.atan2(x - cx, -(y - cy)) * 180 / Math.PI + 360) % 360;
      if ((a - ang + 360) % 360 < swept) {
        const b = $("pings").children[i];
        b.classList.remove("hit"); void b.offsetWidth; b.classList.add("hit");
      }
    });
    if (a < lastSweep && ++sweepCount % 3 === 0) log(`SWEEP ${String(sweepCount).padStart(3, "0")} · ${POIS.length} CONTACTS`);
  }
  lastSweep = a;

  if (river) for (const p of particles) p.u = (p.u + p.speed / 60) % 1;
}

function sizeCanvas() {
  dpr = Math.min(2, devicePixelRatio || 1);
  for (const c of [fxc, litc]) { c.width = innerWidth * dpr; c.height = innerHeight * dpr; }
  litDirty = true;
}

// Bright contours rasterised once per camera position; the sweep only masks this bitmap.
function rasterLit() {
  const m = svg.getScreenCTM(), g = litc.getContext("2d");
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.clearRect(0, 0, litc.width, litc.height);
  g.setTransform(dpr * m.a, 0, 0, dpr * m.d, dpr * m.e, dpr * m.f);
  g.lineWidth = 1.3 / m.a;
  g.strokeStyle = "#e6fffb";
  for (const { p, o } of litPaths) { g.globalAlpha = o; g.stroke(p); }
  litDirty = false;
}

// Canvas conic angles start at 3 o'clock; the sweep angle is measured from 12 o'clock.
function wedge(rad, stops) {
  const g = fx.createConicGradient(rad, fxc.width / 2, fxc.height / 2);
  for (const [at, color] of stops) g.addColorStop(at, color);
  return g;
}

function drawFx(now, a) {
  const W = fxc.width, H = fxc.height, rad = (a - 90) * Math.PI / 180;
  fx.setTransform(1, 0, 0, 1, 0, 0);
  fx.globalAlpha = 1;
  fx.clearRect(0, 0, W, H);

  // Lit contours trailing the beam. Skipped mid-flight, re-rasterised when the camera settles.
  if (!tween) {
    if (litDirty) rasterLit();
    fx.globalCompositeOperation = "source-over";
    fx.drawImage(litc, 0, 0);
    fx.globalCompositeOperation = "destination-in";
    fx.fillStyle = wedge(rad, [[0, "rgba(0,0,0,0)"], [250 / 360, "rgba(0,0,0,0)"], [320 / 360, "rgba(0,0,0,.2)"], [1, "#000"]]);
    fx.fillRect(0, 0, W, H);
  }

  fx.globalCompositeOperation = "lighter";
  fx.fillStyle = wedge(rad, [[0, "rgba(0,0,0,0)"], [300 / 360, "rgba(0,0,0,0)"], [352 / 360, "rgba(63,208,192,.08)"], [1, "rgba(168,255,242,.3)"]]);
  fx.fillRect(0, 0, W, H);
  fx.globalCompositeOperation = "source-over";

  if (!river) return;
  const m = svg.getScreenCTM();
  fx.setTransform(dpr * m.a, 0, 0, dpr * m.d, dpr * m.e, dpr * m.f);
  fx.lineWidth = 1 / m.a;
  fx.setLineDash([2 / m.a, 6 / m.a]);
  fx.lineDashOffset = -(now / 150 % 8) / m.a;
  fx.strokeStyle = "#a8fff2";
  fx.globalAlpha = 0.35;
  fx.stroke(river.path);
  fx.setLineDash([]);
  fx.fillStyle = "#e6fffb";
  for (const p of particles) {
    const [x, y, nx, ny] = riverAt(p.u);
    fx.globalAlpha = 0.4 + p.r / 2;
    fx.beginPath();
    fx.arc(x + nx * p.off, y + ny * p.off, p.r, 0, Math.PI * 2);
    fx.fill();
  }
  fx.globalAlpha = 1;
}
sizeCanvas();
requestAnimationFrame(frame);

// ---------- Cursor readout ----------
svg.parentElement.addEventListener("pointermove", e => {
  if (!state) return;
  const m = svg.getScreenCTM();
  const gx = (e.clientX - m.e) / m.a, gy = (e.clientY - m.f) / m.d;
  if (gx < 0 || gy < 0 || gx >= state.gw || gy >= state.gh) return;
  const [lon, lat] = pix2lonlat(state.ox + gx * state.ds, state.oy + gy * state.ds, state.z);
  $("cursor").textContent = `LAT ${fmtLat(lat)} · LON ${fmtLon(lon)} · ELEV ${fmtM(sample([gx, gy]))}`;
  document.querySelector(".hx").style.cssText = `display:block;top:${e.clientY}px`;
  document.querySelector(".hy").style.cssText = `display:block;left:${e.clientX}px`;
});
document.addEventListener("pointerleave", () => {
  document.querySelector(".hx").style.display = document.querySelector(".hy").style.display = "none";
});
document.addEventListener("click", e => { if (!e.target.closest(".ping, #panel")) closePanel(); });
$("close").addEventListener("click", closePanel);
addEventListener("keydown", e => { if (e.key === "Escape") closePanel(); });

async function load() {
  $("coords").textContent = `${fmtLat(LOC.lat)}  ${fmtLon(LOC.lon)}`;
  $("status").textContent = "ACQUIRING ELEVATION DATA…";
  $("status").classList.add("blink");
  try {
    render(await fetchElevation());
  } catch {
    $("status").innerHTML = `SIGNAL LOST — ELEVATION FEED UNREACHABLE<br><button class="retry" onclick="load()">RETRY</button>`;
    $("status").classList.remove("blink");
  }
}

// Re-fetch when the viewport shape changes enough to need a different tile window.
let resizeTimer;
addEventListener("resize", () => {
  sizeCanvas();
  if (state) { closePanel(); cam = homeCam(); tween = null; applyCam(); }
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { if (state) { const w = tileWindow(); if (w.cols !== state.cols || w.z !== state.z) load(); } }, 300);
});
load();
</script>
</body>
</html>
