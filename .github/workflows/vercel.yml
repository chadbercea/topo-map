name: Deploy game to Vercel

# The Phaser + React game in game/. Pull requests get a preview URL, main goes to production.
# Needs repo secrets VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID.
on:
  push:
    branches: [main]
    paths: ['game/**', 'vercel.json', '.github/workflows/vercel.yml']
  pull_request:
    paths: ['game/**', 'vercel.json', '.github/workflows/vercel.yml']
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: vercel-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_ENV: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: game/package-lock.json

      - name: Typecheck and build
        run: npm ci && npm run build
        working-directory: game

      - name: Check Vercel secrets
        id: secrets
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Vercel secrets are not set; the build passed but nothing was deployed."
          fi

      - name: Deploy
        id: deploy
        if: steps.secrets.outputs.ready == 'true'
        run: |
          PROD=$([ "$VERCEL_ENV" = production ] && echo --prod || true)
          npx --yes vercel@65.2.0 pull --yes --environment="$VERCEL_ENV" --token="$VERCEL_TOKEN"
          npx --yes vercel@65.2.0 build $PROD --token="$VERCEL_TOKEN"
          URL=$(npx --yes vercel@65.2.0 deploy --prebuilt $PROD --token="$VERCEL_TOKEN")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed ($VERCEL_ENV): $URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview URL
        if: github.event_name == 'pull_request' && steps.deploy.outputs.url
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --edit-last --create-if-none --body "Vercel preview: $URL"
